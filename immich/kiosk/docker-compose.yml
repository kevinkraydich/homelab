services:
  immich-kiosk:
    container_name: immich-kiosk
    image: ghcr.io/damongolding/immich-kiosk:latest
    restart: unless-stopped
    tty: true
    env_file: .env
    networks:
      - proxy
    volumes:
      - ./config:/config
      # - ./custom.css:/custom.css
      # - ./offline-assets:/offline-assets
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  proxy:
    external: true
