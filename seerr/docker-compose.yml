services:
  seerr:
    container_name: seerr
    image: ghcr.io/seerr-team/seerr:latest
    restart: unless-stopped
    init: true
    environment:
      - LOG_LEVEL=debug
      - TZ=America/Detroit
      - PORT=5055 #optional
    networks:
      - proxy
    volumes:
      - ./config:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3

networks:
  proxy:
    external: true
