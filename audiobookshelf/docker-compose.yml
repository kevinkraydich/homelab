services:
  audiobookshelf:
    container_name: audiobookshelf
    image: ghcr.io/advplyr/audiobookshelf:latest
    restart: unless-stopped
    ports:
      - 13378:80
    volumes:
      - ./config:/config
      - ./metadata:/metadata
      - type: bind
        source: ${MEDIA_SOURCE}
        target: /media
    env_file: .env
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost || exit 1
      start_period: 30s
      interval: 60s
      timeout: 5s

